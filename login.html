```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arqam TUC Shop - Manager Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eaf7ef,#ffffff,#e8f4ff);
}

.login-box{
    width:380px;
    max-width:92%;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#16733b;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#16733b;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#16733b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0f5c2d;
}

button:disabled{
    background:#888;
    cursor:not-allowed;
}

.error{
    color:#d62828;
    text-align:center;
    margin-top:15px;
    display:none;
    font-weight:bold;
}

.success{
    color:#198754;
    text-align:center;
    margin-top:15px;
    display:none;
    font-weight:bold;
}

.firebase-status{
    text-align:center;
    font-size:13px;
    color:#777;
    margin-top:15px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#16733b;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        ARQAM TUC SHOP
    </div>

    <div class="subtitle">
        Manager Panel Login
    </div>

    <label>Email</label>

    <input
        type="email"
        id="username"
        placeholder="Enter manager email"
        autocomplete="username"
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
    >

    <button id="loginButton">
        LOGIN
    </button>

    <div class="error" id="error"></div>

    <div class="success" id="success">
        Login successful. Opening Manager Panel...
    </div>

    <div class="firebase-status" id="firebaseStatus">
        Connecting to secure login...
    </div>

    <a href="products.html" class="back">
        ← Back to Shop
    </a>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAHxIt-uneG3CSGk-JUPkTG2zJ2zO8ra2t5g",

    authDomain:
        "arqam-tuc-shop.firebaseapp.com",

    projectId:
        "arqam-tuc-shop",

    storageBucket:
        "arqam-tuc-shop.firebasestorage.app",

    messagingSenderId:
        "182232116266",

    appId:
        "1:182232116266:web:0bf8185776faee5e912753",

    measurementId:
        "G-2VRHM6JPTH"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const emailInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const firebaseStatus =
    document.getElementById("firebaseStatus");


firebaseStatus.textContent =
    "🟢 Secure login ready";

firebaseStatus.style.color =
    "#198754";


async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";


    if(!email || !password){

        errorBox.textContent =
            "Please enter email and password.";

        errorBox.style.display =
            "block";

        return;
    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "LOGGING IN...";


    try{

        /*
         IMPORTANT:
         Save Firebase login in browser
         so Admin Panel can detect it.
        */

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        successBox.style.display =
            "block";

        firebaseStatus.textContent =
            "🟢 Manager verified successfully";

        firebaseStatus.style.color =
            "#198754";


        /*
         Give Firebase a moment to save
         the authenticated session.
        */

        setTimeout(function(){

            window.location.replace(
                "admin.html"
            );

        },1000);


    }catch(error){

        console.error(
            "Firebase Login Error:",
            error
        );


        let message =
            "Incorrect email or password.";


        if(
            error.code ===
            "auth/invalid-email"
        ){

            message =
                "Please enter a valid email.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
                "Manager account not found.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            message =
                "Incorrect password.";

        }

        else if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
                "Incorrect email or password.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            message =
                "Too many attempts. Please try again later.";

        }

        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            message =
                "Internet connection problem.";

        }

        else{

            message =
                "Login error: " +
                error.message;

        }


        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";


        loginButton.disabled =
            false;

        loginButton.textContent =
            "LOGIN";

    }

}


loginButton.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);

</script>

</body>
</html>
